name: Deploy latest annual website to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find and fetch the latest annual website source
        shell: bash
        run: |
          set -euo pipefail

          repos_file="$RUNNER_TEMP/qracon-public-repos.jsonl"
          : > "$repos_file"
          page=1

          while true; do
            response=$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              "https://api.github.com/orgs/QRACON-tw/repos?type=public&per_page=100&page=${page}")
            count=$(jq 'length' <<< "$response")
            if [ "$count" -eq 0 ]; then
              break
            fi

            jq -c '.[]' <<< "$response" >> "$repos_file"
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          latest=$(jq -sc '
            map(select(.name | test("^20[0-9]{2}$")))
            | map(select((.disabled // false) == false and (.default_branch // "") != ""))
            | sort_by(.name | tonumber)
            | last // empty
          ' "$repos_file")

          if [ -z "$latest" ]; then
            echo "No enabled public QRACON-tw repository named YYYY with a default branch was found." >&2
            exit 1
          fi

          repo=$(jq -r '.name' <<< "$latest")
          branch=$(jq -r '.default_branch' <<< "$latest")
          echo "Selected annual website: QRACON-tw/$repo ($branch)"
          git clone --depth 1 --single-branch --branch "$branch" \
            "https://github.com/QRACON-tw/$repo.git" source

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the selected website for the root Pages URL
        working-directory: source
        run: |
          cat > astro.pages.config.mjs <<'EOF'
          import { defineConfig } from 'astro/config';
          import config from './astro.config.mjs';

          export default defineConfig({
            ...config,
            site: 'https://qracon-tw.github.io',
          });
          EOF
          pnpm exec astro build --config ./astro.pages.config.mjs

      - name: Upload the built website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
