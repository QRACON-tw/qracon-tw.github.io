name: Deploy latest 2026 to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the latest 2026 website source
        run: git clone --depth 1 --single-branch --branch main https://github.com/QRACON-tw/2026.git source

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build for the root Pages URL
        working-directory: source
        run: |
          cat > astro.pages.config.mjs <<'EOF'
          import { defineConfig } from 'astro/config';
          import config from './astro.config.mjs';

          export default defineConfig({
            ...config,
            site: 'https://qracon-tw.github.io',
          });
          EOF
          pnpm exec astro build --config ./astro.pages.config.mjs

      - name: Upload the built website
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
