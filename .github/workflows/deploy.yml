name: Deploy the latest QRACON annual site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      year: ${{ steps.latest.outputs.year }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Find the newest public annual Pages repository
        id: latest
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request

          years = []
          for page in range(1, 101):
              url = (
                  "https://api.github.com/orgs/QRACON-tw/repos"
                  f"?type=public&per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "QRACON-Pages-Deploy",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  repositories = json.load(response)
              for repository in repositories:
                  name = repository.get("name", "")
                  if (
                      len(name) == 4
                      and name.isascii()
                      and name.isdigit()
                      and repository.get("has_pages") is True
                      and repository.get("private") is False
                      and repository.get("archived") is False
                      and repository.get("disabled") is False
                  ):
                      years.append(name)
              if len(repositories) < 100:
                  break
          if not years:
              raise SystemExit("No public annual Pages repository was found")
          print(f"year={max(years)}")
          PY

      - name: Read the newest annual main revision
        id: source
        env:
          YEAR: ${{ steps.latest.outputs.year }}
        shell: bash
        run: |
          if [[ ! "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Invalid annual repository name" >&2
            exit 1
          fi
          revision="$(git ls-remote "https://github.com/QRACON-tw/${YEAR}.git" refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ ! "$revision" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Could not resolve the annual main revision" >&2
            exit 1
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Restore the previously published revision marker
        id: published
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .published-source
          key: latest-annual-${{ steps.latest.outputs.year }}-${{ steps.source.outputs.revision }}

      - name: Decide whether to deploy
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          CACHE_HIT: ${{ steps.published.outputs.cache-hit }}
        shell: bash
        run: |
          deploy=true
          if [[ "$EVENT_NAME" == "schedule" && "$CACHE_HIT" == "true" ]]; then
            deploy=false
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      year: ${{ needs.resolve.outputs.year }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Fetch the newest annual site
        id: source
        env:
          YEAR: ${{ needs.resolve.outputs.year }}
        shell: bash
        run: |
          if [[ ! "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Invalid annual repository name" >&2
            exit 1
          fi
          git clone --depth 1 --branch main --single-branch "https://github.com/QRACON-tw/${YEAR}.git" annual-site
          revision="$(git -C annual-site rev-parse HEAD)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Could not resolve the checked out annual revision" >&2
            exit 1
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: annual-site
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build annual site at the domain root
        working-directory: annual-site
        env:
          ASTRO_BASE_PATH: /
        run: pnpm build

      - name: Upload the latest annual website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: annual-site/dist

  deploy:
    needs: [resolve, build]
    if: needs.resolve.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the latest annual website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Prepare the published annual revision marker
        env:
          YEAR: ${{ needs.build.outputs.year }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          mkdir -p .published-source
          printf '%s\n' "${YEAR}:${REVISION}" > .published-source/revision

      - name: Save the published annual revision marker
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .published-source
          key: latest-annual-${{ needs.build.outputs.year }}-${{ needs.build.outputs.revision }}
