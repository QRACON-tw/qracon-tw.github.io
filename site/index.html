<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QRACON 年度網站入口。" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>QRACON｜年度網站</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: #17243a;
        background: #f4f6fa;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      main { width: min(100%, 720px); }

      .eyebrow {
        margin: 0 0 12px;
        color: #435b7c;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }

      .intro {
        margin: 18px 0 36px;
        color: #53647b;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .year-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 28px 30px;
        border: 1px solid #dce3ee;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 42px rgb(34 54 82 / 8%);
        color: inherit;
        text-decoration: none;
        transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
      }

      .year-card:hover,
      .year-card:focus-visible {
        border-color: #4169a3;
        box-shadow: 0 20px 48px rgb(34 54 82 / 13%);
        transform: translateY(-2px);
      }

      .year-card:focus-visible { outline: 3px solid #8fb6ee; outline-offset: 4px; }

      .year-label { display: block; color: #53647b; font-size: 0.9rem; }
      .year { display: block; margin-top: 4px; font-size: 2.1rem; font-weight: 800; letter-spacing: -0.04em; }
      .action { color: #315d98; font-size: 1rem; font-weight: 700; white-space: nowrap; }
      footer { margin-top: 28px; color: #718096; font-size: 0.82rem; }

      @media (max-width: 520px) {
        .year-card { align-items: flex-start; flex-direction: column; gap: 16px; padding: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">QUANTUM COMPUTER CONFERENCE</p>
      <h1>QRACON</h1>
      <p class="intro">學生量子電腦年會年度網站入口。選擇年度以瀏覽當屆活動資訊。</p>

      <a class="year-card" href="/2026/">
        <span>
          <span class="year-label">年度官網</span>
          <span class="year">2026</span>
        </span>
        <span class="action">前往 2026 官網 →</span>
      </a>

      <footer>QRACON｜學生量子電腦年會</footer>
    </main>
  </body>
</html>
