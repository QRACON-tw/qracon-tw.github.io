<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="自動前往 QRACON 最新年度官網。" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>前往 QRACON 最新年度官網</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: #17243a;
        background: #f4f6fa;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 38rem);
        padding: 2rem;
        border: 1px solid #dce3ee;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 16px 42px rgb(34 54 82 / 8%);
        line-height: 1.8;
      }

      a { color: #315d98; }
    </style>
  </head>
  <body>
    <main>
      <p id="status" role="status" aria-live="polite">正在查詢最新年度官網…</p>
      <p><a id="latest-link" href="https://github.com/orgs/QRACON-tw/repositories?type=public">前往 QRACON 的公開 GitHub repos</a></p>
      <noscript>此入口需要 JavaScript 才能辨識最新年度；請前往 <a href="https://github.com/orgs/QRACON-tw/repositories?type=public">QRACON-tw 的公開 GitHub repos</a> 查找年度官網。</noscript>
    </main>
    <script>
      (() => {
        const fallbackUrl = 'https://github.com/orgs/QRACON-tw/repositories?type=public';
        const link = document.querySelector('#latest-link');
        const status = document.querySelector('#status');

        async function findLatestYear() {
          const years = [];

          for (let page = 1; page <= 100; page += 1) {
            const response = await fetch(
              `https://api.github.com/orgs/QRACON-tw/repos?type=public&per_page=100&page=${page}`,
              {
                headers: {
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              },
            );

            if (!response.ok) throw new Error('GitHub API request failed');

            const repos = await response.json();
            if (!Array.isArray(repos)) throw new Error('Unexpected GitHub API response');

            for (const repo of repos) {
              if (
                /^\d{4}$/.test(repo.name) &&
                repo.has_pages === true &&
                !repo.archived &&
                !repo.disabled &&
                !repo.private
              ) {
                years.push(Number(repo.name));
              }
            }

            if (repos.length < 100) break;
            if (page === 100) throw new Error('Too many repository pages');
          }

          if (years.length === 0) throw new Error('No annual Pages repository found');
          return Math.max(...years);
        }

        findLatestYear()
          .then((year) => {
            const path = `/${year}/`;
            link.href = path;
            link.textContent = `前往 QRACON ${year} 年度官網`;
            status.textContent = `正在前往 QRACON ${year} 年度官網…`;
            window.location.replace(path);
          })
          .catch(() => {
            status.textContent = '目前無法確認最新年度官網，請稍後再試。';
            link.href = fallbackUrl;
            link.textContent = '前往 QRACON 的公開 GitHub repos';
          });
      })();
    </script>
  </body>
</html>
